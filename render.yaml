services:
  - type: web
    name: be-vui-hoc-toan-1
    runtime: static
    buildCommand: "rm -rf public && mkdir -p public && cp index.html public/ && cp -r css js Asset public/"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: kid-math-netplay
    runtime: docker
    plan: free
    dockerfilePath: ./netplay/Dockerfile
    dockerContext: ./netplay
    envVars:
      - key: ALLOWED_ORIGIN
        value: "*"

  - type: web
    name: kid-math-rom-relay
    runtime: python
    plan: free
    buildCommand: "python -m py_compile server/rom_relay.py"
    startCommand: "python server/rom_relay.py"
    envVars:
      - key: PORT
        value: "10000"
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiểm thử — Bé Vui Học Toán 1</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f6fbff;
      color: #23344d;
    }
    .page { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .lead { color: #54678a; margin: 0 0 18px; font-size: 0.92rem; }
    .summary {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .summary.pass { background: #defbea; color: #11603f; border: 2px solid #a9efc9; }
    .summary.fail { background: #ffe4e1; color: #8c2013; border: 2px solid #ffc0b8; }
    .suite { background: #fff; border-radius: 18px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 8px 22px rgba(35,52,77,.07); }
    .suite h2 { font-size: 1rem; margin: 0 0 8px; }
    .suite ul { list-style: none; margin: 0; padding: 0; }
    .suite li { padding: 5px 0; font-size: 0.9rem; border-top: 1px dashed #e2ecf8; }
    .suite li:first-child { border-top: 0; }
    .suite li.pass { color: #11603f; }
    .suite li.fail { color: #a3241a; font-weight: 700; }
    .back { display: inline-block; margin-top: 10px; color: #0e6d93; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Kiểm thử tự động</h1>
    <p class="lead">Chạy trong trình duyệt, không cần Node. Tải lại trang để chạy lại.</p>
    <div id="test-summary" class="summary">Đang chạy…</div>
    <div id="test-output"></div>
    <a class="back" href="../index.html">← Về game</a>
  </div>

  <script src="../js/core/rng.js"></script>
  <script src="../js/core/vi-numbers.js"></script>
  <script src="../js/core/speech.js"></script>
  <script src="../js/data/tuning.js"></script>
  <script src="../js/data/curriculum.js"></script>
  <script src="../js/data/racers.js"></script>
  <script src="../js/domain/questions.js"></script>
  <script src="../js/domain/lesson-session.js"></script>
  <script src="../js/domain/progress.js"></script>
  <script src="../js/domain/race.js"></script>

  <script src="unit/framework.js"></script>
  <script src="unit/core.test.js"></script>
  <script src="unit/curriculum.test.js"></script>
  <script src="unit/domain.test.js"></script>
  <script src="unit/race.test.js"></script>
  <script>
    window.addEventListener('load', function () {
      window.KMTest.run();
    });
  </script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="tealCaveTitle tealCaveDesc">
  <title id="tealCaveTitle">Hang động xanh — nền bài học</title>
  <desc id="tealCaveDesc">Original self-generated 8-bit inspired learning scene of a teal cave with platforms, walls, and water. No copyrighted assets.</desc>

  <defs>
    <linearGradient id="caveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A5C5C"/>
      <stop offset="0.5" stop-color="#2A7A7A"/>
      <stop offset="1" stop-color="#1A4A4A"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D3B3B"/>
      <stop offset="1" stop-color="#0A2A2A"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B6914"/>
      <stop offset="0.5" stop-color="#6B4F10"/>
      <stop offset="1" stop-color="#4A3508"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="0.5" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#2A2A2A"/>
    </linearGradient>
    <pattern id="brickPattern2" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="20" fill="#5A4010"/>
      <rect x="1" y="1" width="18" height="8" rx="1" fill="#8B6914"/>
      <rect x="21" y="1" width="18" height="8" rx="1" fill="#7A5A12"/>
      <rect x="-9" y="11" width="18" height="8" rx="1" fill="#7A5A12"/>
      <rect x="11" y="11" width="18" height="8" rx="1" fill="#8B6914"/>
      <rect x="31" y="11" width="18" height="8" rx="1" fill="#7A5A12"/>
    </pattern>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4DD0E1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4DD0E1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="600" fill="url(#caveGrad)"/>

  <!-- Glow spots -->
  <circle cx="200" cy="150" r="120" fill="url(#glowGrad)"/>
  <circle cx="900" cy="200" r="150" fill="url(#glowGrad)"/>
  <circle cx="500" cy="400" r="100" fill="url(#glowGrad)"/>

  <!-- Dark walls (left and right) -->
  <rect x="0" y="0" width="60" height="600" fill="url(#wallGrad)"/>
  <rect x="1140" y="0" width="60" height="600" fill="url(#wallGrad)"/>

  <!-- Mid walls -->
  <rect x="300" y="0" width="40" height="200" fill="url(#wallGrad)"/>
  <rect x="300" y="350" width="40" height="250" fill="url(#wallGrad)"/>
  <rect x="700" y="100" width="40" height="400" fill="url(#wallGrad)"/>
  <rect x="950" y="0" width="40" height="150" fill="url(#wallGrad)"/>
  <rect x="950" y="300" width="40" height="300" fill="url(#wallGrad)"/>

  <!-- Platforms (brown/tan) -->
  <!-- Top platform -->
  <rect x="100" y="80" width="180" height="24" rx="4" fill="url(#platformGrad)"/>
  <rect x="100" y="80" width="180" height="6" rx="2" fill="#A07820" opacity="0.6"/>
  <!-- Mid-left platform -->
  <rect x="50" y="220" width="140" height="24" rx="4" fill="url(#platformGrad)"/>
  <rect x="50" y="220" width="140" height="6" rx="2" fill="#A07820" opacity="0.6"/>
  <!-- Mid-right platform -->
  <rect x="400" y="180" width="200" height="24" rx="4" fill="url(#platformGrad)"/>
  <rect x="400" y="180" width="200" height="6" rx="2" fill="#A07820" opacity="0.6"/>
  <!-- Lower platform -->
  <rect x="760" y="280" width="160" height="24" rx="4" fill="url(#platformGrad)"/>
  <rect x="760" y="280" width="160" height="6" rx="2" fill="#A07820" opacity="0.6"/>
  <!-- Far right platform -->
  <rect x="1000" y="200" width="120" height="24" rx="4" fill="url(#platformGrad)"/>
  <rect x="1000" y="200" width="120" height="6" rx="2" fill="#A07820" opacity="0.6"/>

  <!-- Ground (water level) -->
  <rect x="0" y="520" width="1200" height="80" fill="url(#waterGrad)"/>
  <rect x="0" y="510" width="1200" height="12" fill="#1A5C5C" opacity="0.8"/>
  <!-- Water waves -->
  <path d="M0 515 Q60 505 120 515 Q180 525 240 515 Q300 505 360 515 Q420 525 480 515 Q540 505 600 515 Q660 525 720 515 Q780 505 840 515 Q900 525 960 515 Q1020 505 1080 515 Q1140 525 1200 515" fill="none" stroke="#4DD0E1" stroke-width="2" opacity="0.4"/>

  <!-- Collectible sparkles (decorative) -->
  <circle cx="190" cy="60" r="4" fill="#FFD84D" opacity="0.8"/>
  <circle cx="490" cy="160" r="4" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="840" cy="260" r="4" fill="#4DD0E1" opacity="0.8"/>
  <circle cx="1060" cy="180" r="4" fill="#FFD84D" opacity="0.8"/>

  <!-- Small rocks on ground -->
  <ellipse cx="150" cy="508" rx="8" ry="5" fill="#3A3A3A" opacity="0.6"/>
  <ellipse cx="600" cy="506" rx="10" ry="6" fill="#3A3A3A" opacity="0.6"/>
  <ellipse cx="900" cy="508" rx="7" ry="4" fill="#3A3A3A" opacity="0.6"/>

  <!-- Bubbles -->
  <circle cx="80" cy="450" r="3" fill="#4DD0E1" opacity="0.3"/>
  <circle cx="250" cy="380" r="2" fill="#4DD0E1" opacity="0.25"/>
  <circle cx="500" cy="480" r="4" fill="#4DD0E1" opacity="0.2"/>
  <circle cx="750" cy="420" r="2.5" fill="#4DD0E1" opacity="0.3"/>
  <circle cx="1100" cy="460" r="3.5" fill="#4DD0E1" opacity="0.25"/>
</svg>

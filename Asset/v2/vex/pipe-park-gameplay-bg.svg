<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="pipeParkGameTitle pipeParkGameDesc">
  <title id="pipeParkGameTitle">Công viên ống nước – nền bài học</title>
  <desc id="pipeParkGameDesc">Original self-generated 8-bit inspired learning scene of a friendly repair kid in a pipe park. No copyrighted assets; no pre-placed fruit, answer signs, or digits.</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C94FC"/>
      <stop offset="1" stop-color="#A9D2FF"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6C2" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFD84D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.52" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#E0A021"/>
    </radialGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C7A38"/>
      <stop offset="0.30" stop-color="#2FA84F"/>
      <stop offset="0.62" stop-color="#5BD070"/>
      <stop offset="1" stop-color="#1C7A38"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BDB7C"/>
      <stop offset="1" stop-color="#2FA84F"/>
    </linearGradient>
    <pattern id="brickPattern" width="120" height="44" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="120" height="44" fill="#8A4521"/>
      <rect x="2" y="2" width="56" height="18" rx="2" fill="#C86A35"/>
      <rect x="62" y="2" width="56" height="18" rx="2" fill="#C86A35"/>
      <rect x="-28" y="24" width="56" height="18" rx="2" fill="#C86A35"/>
      <rect x="32" y="24" width="56" height="18" rx="2" fill="#C86A35"/>
      <rect x="92" y="24" width="56" height="18" rx="2" fill="#C86A35"/>
      <path d="M5 5 H55 M65 5 H115 M9 27 H55 M37 27 H85 M97 27 H117" fill="none" stroke="#E59B66" stroke-width="2" opacity="0.55"/>
    </pattern>
    <g id="cloudShape">
      <path d="M0 36 V22 H16 V12 H34 V0 H82 V10 H100 V22 H120 V36 Z" fill="#F8FCFF" stroke="#D3E7FF" stroke-width="3" stroke-linejoin="round"/>
      <path d="M5 36 H115" fill="none" stroke="#C8DEFF" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="coinShape">
      <circle cx="0" cy="0" r="23" fill="url(#goldGrad)" stroke="#3A2317" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#FFF0A3" stroke-width="4" opacity="0.9"/>
      <path d="M-10 -7 A13 13 0 0 1 1 -12" fill="none" stroke="#FFFBEA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    </g>
    <g id="sparkShape">
      <path d="M0 -14 L3 -4 L13 0 L3 4 L0 14 L-3 4 L-13 0 L-3 -4 Z" fill="#FFF3B0" stroke="#E5A323" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1200" height="600" fill="url(#skyGrad)"/>

  <!-- Sun and stepped rays -->
  <circle cx="1040" cy="122" r="100" fill="url(#sunGlow)"/>
  <g fill="#FFE980" opacity="0.85">
    <rect x="1033" y="34" width="14" height="18" rx="3"/>
    <rect x="1033" y="194" width="14" height="18" rx="3"/>
    <rect x="952" y="115" width="18" height="14" rx="3"/>
    <rect x="1110" y="115" width="18" height="14" rx="3"/>
  </g>
  <circle cx="1040" cy="122" r="48" fill="#FFD84D" stroke="#FFF0A3" stroke-width="5"/>

  <!-- Blocky pixel clouds -->
  <use href="#cloudShape" transform="translate(70 66) scale(1.05)"/>
  <use href="#cloudShape" transform="translate(360 42) scale(0.82)"/>
  <use href="#cloudShape" transform="translate(690 86) scale(0.92)"/>
  <use href="#cloudShape" transform="translate(1024 176) scale(0.68)"/>

  <!-- Tiny pixel birds at the top edge -->
  <g fill="none" stroke="#3A2317" stroke-width="3.5" stroke-linecap="round" opacity="0.7">
    <path d="M302 82 l9 -7 l9 7"/>
    <path d="M334 94 l7 -5 l7 5"/>
    <path d="M598 158 l8 -6 l8 6"/>
  </g>

  <!-- SOFT ROLLING HILLS -->
  <path d="M0 330 C120 288 214 266 330 300 C448 336 522 344 642 308 C762 272 862 290 962 326 C1062 362 1142 336 1200 310 L1200 600 L0 600 Z" fill="#8ED96A"/>
  <path d="M0 400 C140 358 250 384 360 408 C480 434 580 400 700 384 C820 368 930 402 1040 424 C1120 440 1170 424 1200 408 L1200 600 L0 600 Z" fill="#63C74D"/>
  <path d="M0 462 C130 434 260 460 380 480 C500 498 620 466 740 454 C860 442 980 472 1090 486 C1140 492 1180 486 1200 480 L1200 600 L0 600 Z" fill="#3E9B35"/>

  <!-- Pixel tufts on the hills (left/center only; right zone stays clean) -->
  <g fill="#2F7F2A" opacity="0.55">
    <rect x="88" y="378" width="14" height="7"/><rect x="106" y="372" width="10" height="13"/>
    <rect x="266" y="350" width="12" height="7"/><rect x="280" y="344" width="9" height="13"/>
    <rect x="506" y="408" width="14" height="7"/><rect x="522" y="402" width="10" height="13"/>
    <rect x="700" y="382" width="12" height="7"/><rect x="714" y="376" width="9" height="13"/>
  </g>

  <!-- BRICK GROUND STRIP -->
  <rect x="0" y="566" width="1200" height="34" fill="url(#brickPattern)"/>
  <rect x="0" y="536" width="1200" height="32" fill="#63C74D" stroke="#2F7F2A" stroke-width="4"/>
  <g fill="#63C74D">
    <rect x="30" y="528" width="18" height="12"/><rect x="118" y="528" width="14" height="12"/>
    <rect x="242" y="528" width="20" height="12"/><rect x="388" y="528" width="16" height="12"/>
    <rect x="520" y="528" width="18" height="12"/><rect x="656" y="528" width="14" height="12"/>
    <rect x="790" y="528" width="20" height="12"/><rect x="930" y="528" width="16" height="12"/>
    <rect x="1064" y="528" width="18" height="12"/><rect x="1160" y="528" width="16" height="12"/>
  </g>
  <rect x="0" y="564" width="1200" height="6" fill="#8A4521" opacity="0.35"/>

  <!-- PLAIN GREEN PIPES: one by the character, one tall at the far right edge -->
  <g stroke="#145F2B" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="350" cy="538" rx="46" ry="7" fill="#2F7F2A" stroke="none" opacity="0.4"/>
    <rect x="326" y="458" width="48" height="78" rx="8" fill="url(#pipeGrad)"/>
    <rect x="314" y="438" width="72" height="30" rx="8" fill="url(#rimGrad)"/>
    <rect x="336" y="470" width="8" height="56" rx="4" fill="#C6F2C0" stroke="none" opacity="0.55"/>

    <ellipse cx="1184" cy="538" rx="56" ry="8" fill="#2F7F2A" stroke="none" opacity="0.4"/>
    <rect x="1160" y="326" width="52" height="210" rx="9" fill="url(#pipeGrad)"/>
    <rect x="1148" y="304" width="76" height="32" rx="9" fill="url(#rimGrad)"/>
    <rect x="1172" y="344" width="9" height="180" rx="4" fill="#C6F2C0" stroke="none" opacity="0.5"/>
  </g>

  <!-- Floating plain coin rings (kept high in the sky) -->
  <use href="#coinShape" transform="translate(330 150)"/>
  <use href="#coinShape" transform="translate(392 112) scale(0.8)"/>
  <use href="#coinShape" transform="translate(650 96) scale(0.9)"/>
  <use href="#coinShape" transform="translate(880 130) scale(0.72)"/>
  <use href="#coinShape" transform="translate(1010 96) scale(0.85)"/>
  <use href="#coinShape" transform="translate(1112 176) scale(0.6)"/>

  <!-- Star sparkles -->
  <use href="#sparkShape" transform="translate(160 232) scale(1.05)"/>
  <use href="#sparkShape" transform="translate(470 190) scale(0.8)"/>
  <use href="#sparkShape" transform="translate(742 212) scale(0.9)"/>
  <use href="#sparkShape" transform="translate(930 66) scale(1)"/>
  <use href="#sparkShape" transform="translate(1160 232) scale(0.75)"/>
  <use href="#sparkShape" transform="translate(56 300) scale(0.7)"/>

  <!-- ORIGINAL CHARACTER: Bé Thợ, young repair kid (decorative, scaled from the intro) -->
  <g id="be-tho" transform="translate(45 -4) scale(0.78)">
    <ellipse cx="176" cy="702" rx="76" ry="10" fill="#2F7F2A" opacity="0.35" stroke="none"/>

    <!-- boots and legs -->
    <g stroke="#3A2317" stroke-width="5" stroke-linejoin="round">
      <rect x="140" y="620" width="24" height="54" fill="#4A7FB5"/>
      <rect x="190" y="620" width="24" height="54" fill="#4A7FB5"/>
      <rect x="130" y="670" width="40" height="30" rx="7" fill="#6B3B22"/>
      <rect x="184" y="670" width="40" height="30" rx="7" fill="#6B3B22"/>
    </g>

    <!-- shirt -->
    <rect x="122" y="528" width="108" height="102" rx="18" fill="#7EC8E3" stroke="#3A2317" stroke-width="5"/>

    <!-- orange apron with straps and pocket -->
    <path d="M150 538 L158 512 M202 538 L194 512" fill="none" stroke="#3A2317" stroke-width="14" stroke-linecap="round"/>
    <path d="M150 538 L158 512 M202 538 L194 512" fill="none" stroke="#F39334" stroke-width="8" stroke-linecap="round"/>
    <path d="M142 536 L210 536 L216 630 L136 630 Z" fill="#F39334" stroke="#3A2317" stroke-width="5" stroke-linejoin="round"/>
    <rect x="140" y="534" width="72" height="13" rx="5" fill="#D96F22" stroke="#3A2317" stroke-width="4"/>
    <rect x="154" y="578" width="44" height="31" rx="5" fill="#FFB35C" stroke="#3A2317" stroke-width="4"/>

    <!-- left arm and hand -->
    <rect x="96" y="546" width="28" height="66" rx="13" fill="#7EC8E3" stroke="#3A2317" stroke-width="5"/>
    <circle cx="110" cy="616" r="14" fill="#F6C89F" stroke="#3A2317" stroke-width="4"/>

    <!-- raised right arm and hand -->
    <path d="M228 552 L258 510" fill="none" stroke="#3A2317" stroke-width="30" stroke-linecap="round"/>
    <path d="M228 552 L258 510" fill="none" stroke="#7EC8E3" stroke-width="22" stroke-linecap="round"/>
    <circle cx="262" cy="505" r="15" fill="#F6C89F" stroke="#3A2317" stroke-width="4"/>

    <!-- open-end wrench, original simple tool shape -->
    <g transform="rotate(18 264 468)" stroke-linecap="round" fill="none">
      <path d="M264 500 L264 448 M264 448 L250 430 M264 448 L278 430" stroke="#3A2317" stroke-width="18"/>
      <path d="M264 500 L264 448 M264 448 L250 430 M264 448 L278 430" stroke="#B9C6CC" stroke-width="11"/>
      <rect x="258" y="490" width="12" height="14" rx="3" fill="#B9C6CC" stroke="#3A2317" stroke-width="3"/>
    </g>

    <!-- ears, head, hair -->
    <circle cx="122" cy="476" r="11" fill="#F6C89F" stroke="#3A2317" stroke-width="4"/>
    <circle cx="230" cy="476" r="11" fill="#F6C89F" stroke="#3A2317" stroke-width="4"/>
    <circle cx="176" cy="470" r="54" fill="#F6C89F" stroke="#3A2317" stroke-width="5"/>
    <path d="M126 446 Q130 418 152 412 L202 412 Q224 420 226 446 Q206 434 186 438 Q158 430 126 446 Z" fill="#4A2E1D" stroke="#3A2317" stroke-width="4" stroke-linejoin="round"/>

    <!-- green mechanic cap with a plain sun badge (no letter, no logo) -->
    <path d="M122 440 Q124 382 176 382 Q228 382 230 440 Z" fill="#2FA84F" stroke="#3A2317" stroke-width="5" stroke-linejoin="round"/>
    <path d="M112 438 Q176 424 240 438 Q240 452 176 451 Q112 452 112 438 Z" fill="#1C7A38" stroke="#3A2317" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="176" cy="406" r="12" fill="#FFD84D" stroke="#3A2317" stroke-width="4"/>
    <path d="M176 398 V400 M176 412 V414 M168 406 H170 M182 406 H184" stroke="#3A2317" stroke-width="3" stroke-linecap="round"/>

    <!-- round glasses -->
    <path d="M124 466 L138 464 M214 464 L228 466" fill="none" stroke="#3A2317" stroke-width="4" stroke-linecap="round"/>
    <circle cx="156" cy="470" r="19" fill="#FFFFFF" fill-opacity="0.35" stroke="#3A2317" stroke-width="5"/>
    <circle cx="196" cy="470" r="19" fill="#FFFFFF" fill-opacity="0.35" stroke="#3A2317" stroke-width="5"/>
    <path d="M175 467 Q176 464 177 467" fill="none" stroke="#3A2317" stroke-width="4"/>
    <circle cx="156" cy="472" r="4.5" fill="#3A2317" stroke="none"/>
    <circle cx="196" cy="472" r="4.5" fill="#3A2317" stroke="none"/>

    <!-- friendly face -->
    <circle cx="140" cy="490" r="9" fill="#F08A8A" opacity="0.55" stroke="none"/>
    <circle cx="212" cy="490" r="9" fill="#F08A8A" opacity="0.55" stroke="none"/>
    <circle cx="176" cy="486" r="4" fill="#E8A87C" stroke="#3A2317" stroke-width="2"/>
    <path d="M158 496 Q176 514 194 496" fill="none" stroke="#3A2317" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- EMPTY wooden table: runtime overlays fruit buttons here -->
  <g id="emptyWoodenTable">
    <rect x="410" y="450" width="390" height="22" rx="5" fill="#C86A35" stroke="#3A2317" stroke-width="5"/>
    <rect x="440" y="472" width="16" height="62" fill="#8A4521" stroke="#3A2317" stroke-width="4"/>
    <rect x="764" y="472" width="16" height="62" fill="#8A4521" stroke="#3A2317" stroke-width="4"/>
    <path d="M418 455 H792" stroke="#E59B66" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Small edge bushes and flowers, away from the playable middle-right -->
  <g stroke="#2F7F2A" stroke-width="4">
    <circle cx="62" cy="526" r="22" fill="#3E9B35"/>
    <circle cx="92" cy="534" r="17" fill="#63C74D"/>
    <circle cx="1184" cy="526" r="22" fill="#3E9B35"/>
  </g>
  <g stroke="#3A2317" stroke-width="2">
    <g fill="#F8FCFF"><circle cx="56" cy="504" r="5"/><circle cx="68" cy="504" r="5"/><circle cx="62" cy="496" r="5"/><circle cx="62" cy="512" r="5"/></g>
    <circle cx="62" cy="504" r="3.5" fill="#FFD84D" stroke="none"/>
    <g fill="#F8FCFF"><circle cx="1178" cy="504" r="5"/><circle cx="1190" cy="504" r="5"/><circle cx="1184" cy="496" r="5"/><circle cx="1184" cy="512" r="5"/></g>
    <circle cx="1184" cy="504" r="3.5" fill="#FFD84D" stroke="none"/>
  </g>
</svg>
